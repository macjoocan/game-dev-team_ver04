# 플러그인 무결성 게이트.
# 에이전트 frontmatter의 스킬 참조, 훅이 가리키는 스크립트, README가 말하는 개수 —
# 전부 틀려도 런타임에서는 조용히 무시된다. 그래서 여기서 막는다.

name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 플러그인 무결성 검사
        run: node scripts/validate-plugin.mjs

      # 훅 스크립트만 보고 있었다. 스킬 스크립트 17개(2,848줄)가 검사 밖이었다(REVIEW.md B-7).
      # templates/ 는 프로젝트로 복사되는 파일이라 여기서 깨지면 생성된 하네스가 안 돈다.
      - name: 문법 검사 (훅 + 스킬 스크립트 + 템플릿 전부)
        run: |
          n=0
          for f in scripts/*.mjs skills/*/scripts/*.mjs skills/*/scripts/templates/*.mjs; do
            node --check "$f"
            n=$((n+1))
          done
          echo "문법 검사 $n 파일 통과"

      - name: 생성 도구 스모크 (스펙 -> 실제 산출물)
        run: |
          KIT=skills/art-direction/references/starter-kit
          node skills/ui-art-system/scripts/ui-kit-gen.mjs "$KIT/ui-spec.json" --out /tmp/smoke-ui
          test -f /tmp/smoke-ui/manifest.json || { echo "FAIL: ui-kit-gen 이 manifest 를 안 냈다"; exit 1; }
          test "$(ls /tmp/smoke-ui/*.png | wc -l)" -gt 0 || { echo "FAIL: ui-kit-gen 이 PNG 를 안 냈다"; exit 1; }

          node skills/fx-art-system/scripts/fx-gen.mjs "$KIT/fx-spec.json" --out /tmp/smoke-fx
          test -f /tmp/smoke-fx/manifest.json || { echo "FAIL: fx-gen 이 manifest 를 안 냈다"; exit 1; }
          test "$(ls /tmp/smoke-fx/*_sheet.png | wc -l)" -gt 0 || { echo "FAIL: fx-gen 이 스트립 시트를 안 냈다"; exit 1; }

          echo "생성 도구 2종 스모크 통과 (UI $(ls /tmp/smoke-ui/*.png | wc -l)장 · FX $(ls /tmp/smoke-fx/*_sheet.png | wc -l)시트)"

      # 하네스는 생성만 되는 게 아니라 **실제로 돌아야** 한다. 여기서 안 돌면 프로젝트에서도 안 돈다.
      - name: 밸런스 하네스 스캐폴드 왕복 (생성 -> 실행 -> 판정)
        run: |
          repo="$PWD"
          box="$(mktemp -d)"
          cd "$box"
          git init -q && git config user.email ci@x && git config user.name ci
          echo x > a.txt && git add -A && git commit -qm init

          node "$repo/skills/balance-sim/scripts/sim-scaffold.mjs" --out sim
          for f in run.mjs curve-check.mjs rng.mjs policies.mjs game.mjs targets.mjs lib-stats.mjs README.md; do
            test -f "sim/$f" || { echo "FAIL: sim/$f 가 생성되지 않았다"; exit 1; }
          done

          # 자리표시자 상태에서는 어떤 수치가 나와도 판정이 '측정 불가'(exit 3)여야 한다.
          # 이 가드가 깨지면 하네스가 만든 숫자가 게이트 리포트에 미달로 올라간다.
          node sim/run.mjs --seed 42 --runs 200 > out.md; code=$?
          test $code -eq 3 || { echo "FAIL: 자리표시자인데 exit $code (3 이어야 한다)"; exit 1; }
          grep -q '측정 불가' out.md || { echo "FAIL: 리포트에 측정 불가 판정이 없다"; exit 1; }
          for s in '\[주장\]' '\[증거\]' '\[기준\]' '\[공백\]' '\[잔여 위험\]'; do
            grep -q "$s" out.md || { echo "FAIL: 5섹션 중 $s 가 없다"; exit 1; }
          done

          # A/B · JSON 산출 · 곡선 판정까지 돌아가는지
          node sim/run.mjs --seed 42 --runs 200 --ab damageMax=25 --out r >/dev/null || true
          test -f r/results.json || { echo "FAIL: results.json 이 없다"; exit 1; }
          node sim/curve-check.mjs r/results.json >/dev/null || true

          cd "$repo"; rm -rf "$box"
          echo "하네스 왕복 통과 (생성 8파일 · 자리표시자 가드 · 5섹션 · A/B · 곡선)"

      - name: 경제 하네스 스캐폴드 왕복 (페르소나 비교 · 공정성 판정)
        run: |
          repo="$PWD"
          box="$(mktemp -d)"
          cd "$box"
          git init -q && git config user.email ci@x && git config user.name ci
          echo x > a.txt && git add -A && git commit -qm init

          node "$repo/skills/econ-sim/scripts/econ-scaffold.mjs" --out econ-sim
          for f in econ-run.mjs personas.mjs economy.mjs econ-targets.mjs lib-stats.mjs rng.mjs README.md; do
            test -f "econ-sim/$f" || { echo "FAIL: econ-sim/$f 가 생성되지 않았다"; exit 1; }
          done

          node econ-sim/econ-run.mjs --seed 7 --cohort 300 --days 30 > out.md; code=$?
          test $code -eq 3 || { echo "FAIL: 자리표시자인데 exit $code (3 이어야 한다)"; exit 1; }

          # 실제 로직을 켜면 페르소나 비교와 공정성 판정이 나와야 한다.
          sed -i 's/export const PLACEHOLDER = true;/export const PLACEHOLDER = false;/' econ-sim/economy.mjs
          node econ-sim/econ-run.mjs --seed 7 --cohort 800 --days 30 --out e > real.md || true
          test -f e/econ-results.json || { echo "FAIL: econ-results.json 이 없다"; exit 1; }
          for s in '무과금 완주율' '페이투윈 격차' '페르소나별 곡선' '재화 수지'; do
            grep -q "$s" real.md || { echo "FAIL: 리포트에 '$s' 가 없다"; exit 1; }
          done
          grep -q '컴플라이언스' real.md || { echo "FAIL: [공백]에 컴플라이언스 한계 고지가 없다"; exit 1; }

          cd "$repo"; rm -rf "$box"
          echo "경제 하네스 왕복 통과 (자리표시자 가드 · 페르소나 4종 · 공정성 판정 · 한계 고지)"

      # 잘못 부르면 안내를 내야 한다. Node 스택트레이스는 안내가 아니다.
      # (인자 없이 기본값으로 도는 생성기도 있으니 "usage 를 냈나"가 아니라 "안 터졌나"를 본다)
      - name: 스크립트를 잘못 불러도 스택트레이스를 안 내는지
        run: |
          # 기본값으로 도는 생성기가 파일을 쓰므로 임시 디렉터리에서 돌린다(레포를 더럽히지 않게).
          repo="$PWD"
          sandbox="$(mktemp -d)"
          fail=0
          for f in "$repo"/skills/*/scripts/*.mjs; do
            for a in "" "--help"; do
              out=$(cd "$sandbox" && node "$f" $a 2>&1 || true)
              case "$out" in
                *"node:internal"*|*"    at "*)
                  echo "FAIL: ${f#$repo/} (인자 '$a') 가 스택트레이스를 낸다"
                  echo "$out" | head -3
                  fail=1 ;;
              esac
            done
          done
          rm -rf "$sandbox"
          [ $fail -eq 0 ] || exit 1
          echo "스킬 스크립트 인자 검증 통과"

      - name: 훅이 세션을 깨지 않는지 (빈 입력 · 깨진 입력에도 exit 0)
        run: |
          for f in scripts/check-balance-hardcode.mjs \
                   scripts/check-commit-gate.mjs \
                   scripts/inject-pipeline-state.mjs \
                   scripts/log-agent-gate.mjs; do
            echo '' | node "$f" >/dev/null || { echo "FAIL(빈 입력): $f"; exit 1; }
            echo 'not json' | node "$f" >/dev/null || { echo "FAIL(깨진 입력): $f"; exit 1; }
          done
          echo "훅 4종 모두 fail-open 확인"
