# 플러그인 무결성 게이트.
# 에이전트 frontmatter의 스킬 참조, 훅이 가리키는 스크립트, README가 말하는 개수 —
# 전부 틀려도 런타임에서는 조용히 무시된다. 그래서 여기서 막는다.
#
# [주의] GitHub Actions 는 run: 블록을 `bash -e` 로 돈다.
#   `cmd > out; code=$?`  -> cmd 가 비영점이면 그 자리에서 스텝이 죽는다(code 를 볼 기회가 없다).
#   `code=0; cmd > out || code=$?`  <- 반드시 이 형태로 써라.
#   측정 불가(exit 3)를 기대하는 검사가 여럿이라 이걸 틀리면 CI 가 통째로 빨개진다(실제 발생, v0.27.1).
#   로컬 확인: node scripts/ci-local.mjs  (맨 bash 로 돌리면 이 버그가 안 보인다)

name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 플러그인 무결성 검사
        run: node scripts/validate-plugin.mjs

      # 훅 스크립트만 보고 있었다. 스킬 스크립트 17개(2,848줄)가 검사 밖이었다(REVIEW.md B-7).
      # templates/ 는 프로젝트로 복사되는 파일이라 여기서 깨지면 생성된 하네스가 안 돈다.
      - name: 문법 검사 (훅 + 스킬 스크립트 + 템플릿 전부)
        run: |
          n=0
          for f in scripts/*.mjs skills/*/scripts/*.mjs skills/*/scripts/templates/*.mjs; do
            node --check "$f"
            n=$((n+1))
          done
          echo "문법 검사 $n 파일 통과"

      - name: 생성 도구 스모크 (스펙 -> 실제 산출물)
        run: |
          KIT=skills/art-direction/references/starter-kit
          node skills/ui-art-system/scripts/ui-kit-gen.mjs "$KIT/ui-spec.json" --out /tmp/smoke-ui
          test -f /tmp/smoke-ui/manifest.json || { echo "FAIL: ui-kit-gen 이 manifest 를 안 냈다"; exit 1; }
          test "$(ls /tmp/smoke-ui/*.png | wc -l)" -gt 0 || { echo "FAIL: ui-kit-gen 이 PNG 를 안 냈다"; exit 1; }

          node skills/fx-art-system/scripts/fx-gen.mjs "$KIT/fx-spec.json" --out /tmp/smoke-fx
          test -f /tmp/smoke-fx/manifest.json || { echo "FAIL: fx-gen 이 manifest 를 안 냈다"; exit 1; }
          test "$(ls /tmp/smoke-fx/*_sheet.png | wc -l)" -gt 0 || { echo "FAIL: fx-gen 이 스트립 시트를 안 냈다"; exit 1; }

          echo "생성 도구 2종 스모크 통과 (UI $(ls /tmp/smoke-ui/*.png | wc -l)장 · FX $(ls /tmp/smoke-fx/*_sheet.png | wc -l)시트)"

      # 하네스는 생성만 되는 게 아니라 **실제로 돌아야** 한다. 여기서 안 돌면 프로젝트에서도 안 돈다.
      - name: 밸런스 하네스 스캐폴드 왕복 (생성 -> 실행 -> 판정)
        run: |
          repo="$PWD"
          box="$(mktemp -d)"
          cd "$box"
          git init -q && git config user.email ci@x && git config user.name ci
          echo x > a.txt && git add -A && git commit -qm init

          node "$repo/skills/balance-sim/scripts/sim-scaffold.mjs" --out sim
          for f in run.mjs curve-check.mjs rng.mjs policies.mjs game.mjs targets.mjs lib-stats.mjs README.md; do
            test -f "sim/$f" || { echo "FAIL: sim/$f 가 생성되지 않았다"; exit 1; }
          done

          # 자리표시자 상태에서는 어떤 수치가 나와도 판정이 '측정 불가'(exit 3)여야 한다.
          # 이 가드가 깨지면 하네스가 만든 숫자가 게이트 리포트에 미달로 올라간다.
          code=0; node sim/run.mjs --seed 42 --runs 200 > out.md || code=$?
          test $code -eq 3 || { echo "FAIL: 자리표시자인데 exit $code (3 이어야 한다)"; exit 1; }
          grep -q '측정 불가' out.md || { echo "FAIL: 리포트에 측정 불가 판정이 없다"; exit 1; }
          for s in '\[주장\]' '\[증거\]' '\[기준\]' '\[공백\]' '\[잔여 위험\]'; do
            grep -q "$s" out.md || { echo "FAIL: 5섹션 중 $s 가 없다"; exit 1; }
          done

          # A/B · JSON 산출 · 곡선 판정까지 돌아가는지
          node sim/run.mjs --seed 42 --runs 200 --ab damageMax=25 --out r >/dev/null || true
          test -f r/results.json || { echo "FAIL: results.json 이 없다"; exit 1; }
          node sim/curve-check.mjs r/results.json >/dev/null || true

          cd "$repo"; rm -rf "$box"
          echo "하네스 왕복 통과 (생성 8파일 · 자리표시자 가드 · 5섹션 · A/B · 곡선)"

      - name: 경제 하네스 스캐폴드 왕복 (페르소나 비교 · 공정성 판정)
        run: |
          repo="$PWD"
          box="$(mktemp -d)"
          cd "$box"
          git init -q && git config user.email ci@x && git config user.name ci
          echo x > a.txt && git add -A && git commit -qm init

          node "$repo/skills/econ-sim/scripts/econ-scaffold.mjs" --out econ-sim
          for f in econ-run.mjs personas.mjs economy.mjs econ-targets.mjs lib-stats.mjs rng.mjs README.md; do
            test -f "econ-sim/$f" || { echo "FAIL: econ-sim/$f 가 생성되지 않았다"; exit 1; }
          done

          code=0; node econ-sim/econ-run.mjs --seed 7 --cohort 300 --days 30 > out.md || code=$?
          test $code -eq 3 || { echo "FAIL: 자리표시자인데 exit $code (3 이어야 한다)"; exit 1; }

          # 실제 로직을 켜면 페르소나 비교와 공정성 판정이 나와야 한다.
          sed -i 's/export const PLACEHOLDER = true;/export const PLACEHOLDER = false;/' econ-sim/economy.mjs
          node econ-sim/econ-run.mjs --seed 7 --cohort 800 --days 30 --out e > real.md || true
          test -f e/econ-results.json || { echo "FAIL: econ-results.json 이 없다"; exit 1; }
          for s in '무과금 완주율' '페이투윈 격차' '페르소나별 곡선' '재화 수지'; do
            grep -q "$s" real.md || { echo "FAIL: 리포트에 '$s' 가 없다"; exit 1; }
          done
          grep -q '컴플라이언스' real.md || { echo "FAIL: [공백]에 컴플라이언스 한계 고지가 없다"; exit 1; }

          cd "$repo"; rm -rf "$box"
          echo "경제 하네스 왕복 통과 (자리표시자 가드 · 페르소나 4종 · 공정성 판정 · 한계 고지)"

      # 잘못 부르면 안내를 내야 한다. Node 스택트레이스는 안내가 아니다.
      # (인자 없이 기본값으로 도는 생성기도 있으니 "usage 를 냈나"가 아니라 "안 터졌나"를 본다)
      - name: 스크립트를 잘못 불러도 스택트레이스를 안 내는지
        run: |
          # 기본값으로 도는 생성기가 파일을 쓰므로 임시 디렉터리에서 돌린다(레포를 더럽히지 않게).
          repo="$PWD"
          sandbox="$(mktemp -d)"
          fail=0
          for f in "$repo"/skills/*/scripts/*.mjs; do
            for a in "" "--help"; do
              out=$(cd "$sandbox" && node "$f" $a 2>&1 || true)
              case "$out" in
                *"node:internal"*|*"    at "*)
                  echo "FAIL: ${f#$repo/} (인자 '$a') 가 스택트레이스를 낸다"
                  echo "$out" | head -3
                  fail=1 ;;
              esac
            done
          done
          rm -rf "$sandbox"
          [ $fail -eq 0 ] || exit 1
          echo "스킬 스크립트 인자 검증 통과"

      - name: 훅이 세션을 깨지 않는지 (빈 입력 · 깨진 입력에도 exit 0)
        run: |
          for f in scripts/check-balance-hardcode.mjs \
                   scripts/check-commit-gate.mjs \
                   scripts/inject-pipeline-state.mjs \
                   scripts/log-agent-gate.mjs; do
            echo '' | node "$f" >/dev/null || { echo "FAIL(빈 입력): $f"; exit 1; }
            echo 'not json' | node "$f" >/dev/null || { echo "FAIL(깨진 입력): $f"; exit 1; }
          done
          echo "훅 4종 모두 fail-open 확인"

      # 아트 판정 도구 3종. 동봉 starter 팔레트가 **자기 검사를 통과해야** 한다 —
      # 통과하지 않는 기준값을 동봉하면 그 기준을 아무도 안 믿는다.
      - name: 아트 판정 도구 (CVD · 의사 로케일 · 에셋 회귀)
        run: |
          KIT=skills/art-direction/references/starter-kit
          box="$(mktemp -d)"

          # 1) CVD — starter 팔레트는 통과해야 한다(exit 0)
          node skills/visual-qa/scripts/cvd-check.mjs "$KIT/palette.json" > "$box/cvd.md" \n            || { echo "FAIL: 동봉 팔레트가 CVD 검사에서 비영점 종료"; cat "$box/cvd.md"; exit 1; }
          grep -q '판정: \*\*충족\*\*' "$box/cvd.md" || { echo "FAIL: 동봉 팔레트가 CVD 검사를 통과하지 못한다"; cat "$box/cvd.md"; exit 1; }

          # 붕괴하는 팔레트는 반드시 잡아야 한다(exit 1) — 검사기가 실제로 동작하는지 확인
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));p.state.danger=p.primary.base;fs.writeFileSync(process.argv[2],JSON.stringify(p));" "$KIT/palette.json" "$box/bad.json"
          if node skills/visual-qa/scripts/cvd-check.mjs "$box/bad.json" >/dev/null 2>&1; then
            echo "FAIL: danger==primary 인 팔레트를 통과시켰다 — 검사기가 동작하지 않는다"; exit 1
          fi

          # 2) 의사 로케일 — 슬롯 없으면 측정 불가(exit 3)
          printf '%s\n' '{"btn.start":{"ko":"시작","en":"Start"}}' > "$box/s.json"
          code=0; node skills/ui-art-system/scripts/pseudo-loc.mjs "$box/s.json" > "$box/pl.md" || code=$?
          test $code -eq 3 || { echo "FAIL: 슬롯 없이 exit $code (3 이어야 한다)"; exit 1; }
          node skills/ui-art-system/scripts/pseudo-loc.mjs "$box/s.json" --spec "$KIT/ui-spec.json" >/dev/null || true

          # 3) 에셋 회귀 — snap 후 무변화면 충족, 크기를 바꾸면 미달
          node skills/ui-art-system/scripts/ui-kit-gen.mjs "$KIT/ui-spec.json" --out "$box/ui" >/dev/null
          node skills/asset-pipeline/scripts/asset-baseline.mjs snap "$box/ui" --out "$box/base.json" >/dev/null
          node skills/asset-pipeline/scripts/asset-baseline.mjs check "$box/ui" --baseline "$box/base.json" >/dev/null \
            || { echo "FAIL: 변화가 없는데 회귀로 잡았다"; exit 1; }
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));s.sprites[0].w+=16;fs.writeFileSync(process.argv[2],JSON.stringify(s));" "$KIT/ui-spec.json" "$box/spec2.json"
          cp "$KIT/palette.json" "$box/palette.json"
          node skills/ui-art-system/scripts/ui-kit-gen.mjs "$box/spec2.json" --out "$box/ui" >/dev/null
          if node skills/asset-pipeline/scripts/asset-baseline.mjs check "$box/ui" --baseline "$box/base.json" >/dev/null 2>&1; then
            echo "FAIL: 크기가 바뀌었는데 통과시켰다"; exit 1
          fi

          rm -rf "$box"
          echo "아트 판정 도구 3종 통과 (동봉 팔레트 자기검사 · 붕괴 적출 · 오버플로 · 회귀 양방향)"

      # 컷아웃이 "제거율은 높은데 피사체가 녹은" 산출물을 통과시키면 그게 아틀라스까지 간다.
      # 구멍 검사로는 안 잡힌다 — 전체가 반투명해지면 구멍이 0 이다(실측: 불투명 48~64% -> 0.1~3.3%, "구멍 0 · 제거 93%").
      - name: 컷아웃 녹음 적출 (정상 통과 · 과도한 tol 미달)
        run: |
          box="$(mktemp -d)"
          # 그라디언트 배경 위의 단색 피사체 — 실사용(생성 모델의 vignette 배경)과 같은 모양
          node -e "
            const fs=require('fs');
            (async()=>{
              const {writePNG}=await import('./scripts/lib-png.mjs');
              const w=256,h=256,b=Buffer.alloc(w*h*4);
              for(let y=0;y<h;y++)for(let x=0;x<w;x++){
                const o=(y*w+x)*4;
                const d=Math.hypot(x-w/2,y-h/2);
                const g=Math.round(120+70*(d/(w/2)));   // 비네트 그라디언트 배경
                b[o]=g;b[o+1]=g;b[o+2]=g+10;b[o+3]=255;
                if(d<70){b[o]=200;b[o+1]=190;b[o+2]=180;} // 배경과 가까운 밝은 피사체
              }
              writePNG(process.argv[1],w,h,b);
            })();
          " "$box/subject.png"
          code=0; node skills/char-art-system/scripts/cutout.mjs "$box/subject.png" --out "$box/lo" > "$box/lo.log" || code=$?
          test $code -eq 0 || { echo "FAIL: 정상 tol 에서 미달로 잡았다(오탐) exit $code"; cat "$box/lo.log"; exit 1; }
          code=0; node skills/char-art-system/scripts/cutout.mjs "$box/subject.png" --out "$box/hi" --tol 120 > "$box/hi.log" || code=$?
          test $code -eq 1 || { echo "FAIL: tol 120 에서 피사체가 녹았는데 exit $code (1 이어야 한다)"; cat "$box/hi.log"; exit 1; }
          grep -q '피사체가 녹았다' "$box/hi.log" || { echo "FAIL: 녹음 사유를 안 적었다"; cat "$box/hi.log"; exit 1; }
          rm -rf "$box"
          echo "컷아웃 녹음 적출 통과 (정상 오탐 0 · 과도한 tol 적출)"

      # 종료 코드 계약: 입력이 없으면 3(측정 불가)이어야 한다. 1 이면 art-gate 가 "미달"로 읽어
      # 경로 오타가 판정 실패로 둔갑하고, 0 이면 "잰 게 없는데 충족"이 된다(B-14 에서 5개 도구가 위반).
      - name: 판정 도구 입력-없음 계약 (전부 exit 3)
        run: |
          fail=0
          check() { # $1 = 라벨, 나머지 = 명령
            local label="$1"; shift
            local code=0; "$@" >/dev/null 2>&1 || code=$?
            if [ "$code" -ne 3 ]; then echo "FAIL: $label — 없는 입력에 exit $code (3 이어야 한다)"; fail=1; else echo "  ok  $label"; fi
          }
          check cvd-check       node skills/visual-qa/scripts/cvd-check.mjs __none__/palette.json
          check style-score     node skills/art-direction/scripts/style-score.mjs __none__/dir --profile __none__/profile.json
          check pseudo-loc      node skills/ui-art-system/scripts/pseudo-loc.mjs __none__/strings.json
          check asset-baseline  node skills/asset-pipeline/scripts/asset-baseline.mjs check __none__/dir --baseline __none__/b.json
          check scan-textures   node skills/asset-budget/scripts/scan-textures.mjs __none__/dir
          check sprite-qa       node skills/sprite-pipeline/scripts/sprite-qa.mjs __none__/dir
          check flash-check     node skills/polish/scripts/flash-check.mjs __none__/manifest.json
          check feel-audit      node skills/polish/scripts/feel-audit.mjs __none__/feel.json
          test $fail -eq 0 || exit 1
          echo "판정 도구 8종 입력-없음 계약 통과 (전부 exit 3)"

      # heredoc 은 YAML 블록 스칼라 안에서 들여쓰기와 얽히므로 쓰지 않는다.
      - name: FTUE 퍼널 리포트 스모크
        run: |
          box="$(mktemp -d)"
          printf '%s\n' '{ "steps": [{"id":"a","label":"A"},{"id":"b","label":"B"}], "targets": { "stepPassRate": 0.85, "session1to2": [0.3, 0.7] } }' > "$box/steps.json"
          {
            echo '{"event":"session_start","session_id":"s1","session_index":1,"build_version":"abc"}'
            echo '{"event":"ftue_step","session_id":"s1","step_id":"a","step_index":1}'
            echo '{"event":"ftue_step_complete","session_id":"s1","step_id":"a"}'
            echo '{"event":"ftue_step","session_id":"s1","step_id":"b","step_index":2}'
            echo '{"event":"session_end","session_id":"s1","exit_reason":"quit"}'
          } > "$box/events.jsonl"
          out=$(node skills/playtest-capture/scripts/funnel-report.mjs "$box/events.jsonl" --steps "$box/steps.json" || true)
          echo "$out" | grep -q 'FTUE 퍼널 리포트' || { echo "FAIL: 리포트 헤더가 없다"; exit 1; }
          for s in '\[주장\]' '\[증거\]' '\[기준\]' '\[공백\]' '\[잔여 위험\]'; do
            echo "$out" | grep -q "$s" || { echo "FAIL: 5섹션 중 $s 가 없다"; exit 1; }
          done
          # 목표를 줬으므로 단계 판정이 나와야 한다 (통과율 표가 비면 계측 파싱이 깨진 것)
          echo "$out" | grep -q '통과율' || { echo "FAIL: 퍼널 표가 비어 있다"; exit 1; }
          rm -rf "$box"
          echo "FTUE 퍼널 스모크 통과"

      # 아트 게이트 통합 판정 — 두 하네스가 공유하는 표면이므로 여기서 깨지면 양쪽이 깨진다.
      - name: 아트 게이트 통합 판정 왕복
        run: |
          repo="$PWD"
          box="$(mktemp -d)"
          KIT="$repo/skills/art-direction/references/starter-kit"
          cd "$box"
          git init -q && git config user.email ci@x && git config user.name ci
          mkdir -p art && cp "$KIT/palette.json" "$KIT/ui-spec.json" art/
          printf '%s\n' '{"_slots":{"btn.start":"btn_primary_normal"},"btn.start":{"ko":"시작","en":"Start"}}' > art/strings.json
          node "$repo/skills/ui-art-system/scripts/ui-kit-gen.mjs" art/ui-spec.json --out art/out >/dev/null
          echo x > a.txt && git add -A && git commit -qm init

          node "$repo/scripts/art-gate.mjs" --init
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('art-gate.json','utf8'));c.palette='art/palette.json';c.strings='art/strings.json';c.uiSpec='art/ui-spec.json';c.assets='art/out';fs.writeFileSync('art-gate.json',JSON.stringify(c,null,2));"

          # 정상 상태: 충족(exit 0)
          code=0; node "$repo/scripts/art-gate.mjs" --out g > gate.md || code=$?
          test $code -eq 0 || { echo "FAIL: 정상 팔레트인데 exit $code"; cat gate.md; exit 1; }
          test -f g/art-gate.json || { echo "FAIL: art-gate.json 산출물이 없다"; exit 1; }
          for s in '\[주장\]' '\[증거\]' '\[기준\]' '\[공백\]' '\[잔여 위험\]'; do
            grep -q "$s" gate.md || { echo "FAIL: 5섹션 중 $s 가 없다"; exit 1; }
          done
          grep -q '하네스' gate.md || { echo "FAIL: 하네스 기록이 없다 — 판정 비교 근거가 사라진다"; exit 1; }

          # 팔레트를 붕괴시키면 미달(exit 1) 이어야 한다 — 통합 판정이 하위 도구 결과를 실제로 모으는지
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('art/palette.json','utf8'));p.state.danger=p.primary.base;fs.writeFileSync('art/palette.json',JSON.stringify(p,null,2));"
          if node "$repo/scripts/art-gate.mjs" >/dev/null 2>&1; then
            echo "FAIL: 붕괴한 팔레트를 통합 판정이 통과시켰다"; exit 1
          fi

          cd "$repo"; rm -rf "$box"
          echo "아트 게이트 통합 판정 왕복 통과 (충족·5섹션·하네스 기록·붕괴 적출)"

      # 연출 도구 2종. flash-check 는 **안전 게이트**라 "위험을 실제로 잡는지"를 반드시 확인한다 —
      # 절대 안 뜨는 안전 검사는 없는 것보다 나쁘다(있다고 믿게 만든다).
      - name: 연출 도구 (연출 상수 감사 · 광과민성 플래시)
        run: |
          repo="$PWD"
          KIT="$repo/skills/art-direction/references/starter-kit"
          box="$(mktemp -d)"

          # 1) 동봉 feel.json 은 자기 검사를 통과해야 한다
          node skills/polish/scripts/feel-audit.mjs "$KIT/feel.json" > "$box/feel.md" \n            || { echo "FAIL: 동봉 feel.json 이 자기 검사에서 비영점 종료"; cat "$box/feel.md"; exit 1; }
          grep -q '판정: \*\*충족\*\*' "$box/feel.md" || { echo "FAIL: 동봉 feel.json 이 자기 검사를 통과하지 못한다"; cat "$box/feel.md"; exit 1; }

          # 결함을 넣으면 잡아야 한다 (접근성·무게역전·예산초과)
          node -e "const fs=require('fs');const f=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));f.reducedMotion.declared=false;f.events.hit_critical.hitStopFrames=4;fs.writeFileSync(process.argv[2],JSON.stringify(f));" "$KIT/feel.json" "$box/bad-feel.json"
          if node skills/polish/scripts/feel-audit.mjs "$box/bad-feel.json" >/dev/null 2>&1; then
            echo "FAIL: 접근성 누락 + 무게역전을 통과시켰다"; exit 1
          fi

          # 2) 동봉 이펙트는 플래시 안전을 통과해야 한다
          node skills/fx-art-system/scripts/fx-gen.mjs "$KIT/fx-spec.json" --out "$box/fx" >/dev/null
          node skills/polish/scripts/flash-check.mjs "$box/fx/manifest.json" > "$box/flash.md" \n            || { echo "FAIL: 동봉 이펙트가 플래시 안전에서 비영점 종료"; cat "$box/flash.md"; exit 1; }
          grep -q '판정: \*\*충족\*\*' "$box/flash.md" || { echo "FAIL: 동봉 이펙트가 플래시 안전을 통과하지 못한다"; cat "$box/flash.md"; exit 1; }

          # **위험한 스트로브를 실제로 잡는지** — 전체화면 흰↔검 교대 30fps 루프
          # 절대 안 뜨는 안전 검사는 없는 것보다 나쁘다(있다고 믿게 만든다).
          mkdir -p "$box/strobe/fx_strobe"
          export PNGLIB="$repo/scripts/lib-png.mjs" SDIR="$box/strobe/fx_strobe"
          node --input-type=module -e "
            import fs from 'node:fs'; import path from 'node:path';
            const { pathToFileURL } = await import('node:url');
            const { writePNG } = await import(pathToFileURL(process.env.PNGLIB).href);
            const W=32,H=32,N=16,dir=process.env.SDIR;
            for (let k=0;k<N;k++) {
              const b=Buffer.alloc(W*H*4), on=k%2===0, v=on?255:8;
              for (let i=0;i<W*H;i++){const j=i*4;b[j]=v;b[j+1]=v;b[j+2]=v;b[j+3]=255;}
              writePNG(path.join(dir,'f'+String(k).padStart(2,'0')+'.png'),W,H,b);
            }
            fs.writeFileSync(path.join(dir,'..','manifest.json'),
              JSON.stringify({effects:[{name:'fx_strobe',frames:N,fps:30,loop:true,blend:'normal'}]}));
          "
          test "$(ls "$box/strobe/fx_strobe"/*.png | wc -l)" -eq 16 || { echo "FAIL: 스트로브 픽스처 생성 실패"; exit 1; }
          if node skills/polish/scripts/flash-check.mjs "$box/strobe/manifest.json" >/dev/null 2>&1; then
            echo "FAIL: 전체화면 30fps 스트로브를 통과시켰다 — 안전 검사가 동작하지 않는다"; exit 1
          fi
          rm -rf "$box"
          echo "연출 도구 2종 통과 (동봉 자기검사 · 결함 적출 · 스트로브 적출)"

      # 스프라이트 정합성 — **오탐 없음**을 먼저 확인한다. 게이트에서 오탐은 없는 것보다 나쁘다.
      - name: 스프라이트 정합성 판정 (정상 통과 · 결함 적출)
        run: |
          repo="$PWD"
          box="$(mktemp -d)"
          export PNGLIB="$repo/scripts/lib-png.mjs"

          # 정상 걷기 사이클 — 부드러운 사인 운동. **오탐이 나면 실패**
          export SDIR="$box/good"; mkdir -p "$SDIR"
          export MODE=good
          node --input-type=module -e "
            import fs from 'node:fs'; import path from 'node:path';
            const { pathToFileURL } = await import('node:url');
            const { writePNG } = await import(pathToFileURL(process.env.PNGLIB).href);
            const W=48,H=64,N=8, bad=process.env.MODE==='bad';
            for (let k=0;k<N;k++) {
              const b=Buffer.alloc(W*H*4);
              let bx=24+Math.sin(k/N*Math.PI*2)*3, tint=[90,140,220], foot=56;
              if (bad && k===5) tint=[220,120,60];
              if (bad && k===6) foot=44;
              for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
                const j=(y*W+x)*4;
                if (Math.abs(x-bx)<8 && y>foot-40 && y<=foot) { b[j]=tint[0];b[j+1]=tint[1];b[j+2]=tint[2];b[j+3]=255; }
              }
              writePNG(path.join(process.env.SDIR,'f'+String(k).padStart(2,'0')+'.png'),W,H,b);
            }
          "
          test "$(ls "$box/good"/*.png | wc -l)" -eq 8 || { echo "FAIL: 정상 픽스처 생성 실패"; exit 1; }
          node skills/sprite-pipeline/scripts/sprite-qa.mjs "$box/good" > "$box/good.md" || { echo "FAIL: 정상 걷기 사이클을 미달로 냈다 (오탐)"; cat "$box/good.md"; exit 1; }
          grep -q '판정: \*\*충족\*\*' "$box/good.md" || { echo "FAIL: 정상 시퀀스가 충족이 아니다"; cat "$box/good.md"; exit 1; }

          # 결함 시퀀스 — 정체성 드리프트 + baseline 이탈. **적출해야 한다**
          export SDIR="$box/bad"; mkdir -p "$SDIR"; export MODE=bad
          node --input-type=module -e "
            import fs from 'node:fs'; import path from 'node:path';
            const { pathToFileURL } = await import('node:url');
            const { writePNG } = await import(pathToFileURL(process.env.PNGLIB).href);
            const W=48,H=64,N=8, bad=process.env.MODE==='bad';
            for (let k=0;k<N;k++) {
              const b=Buffer.alloc(W*H*4);
              let bx=24+Math.sin(k/N*Math.PI*2)*3, tint=[90,140,220], foot=56;
              if (bad && k===5) tint=[220,120,60];
              if (bad && k===6) foot=44;
              for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
                const j=(y*W+x)*4;
                if (Math.abs(x-bx)<8 && y>foot-40 && y<=foot) { b[j]=tint[0];b[j+1]=tint[1];b[j+2]=tint[2];b[j+3]=255; }
              }
              writePNG(path.join(process.env.SDIR,'f'+String(k).padStart(2,'0')+'.png'),W,H,b);
            }
          "
          test "$(ls "$box/bad"/*.png | wc -l)" -eq 8 || { echo "FAIL: 결함 픽스처 생성 실패"; exit 1; }
          if node skills/sprite-pipeline/scripts/sprite-qa.mjs "$box/bad" >/dev/null 2>&1; then
            echo "FAIL: 정체성 드리프트를 통과시켰다"; exit 1
          fi

          rm -rf "$box"
          echo "스프라이트 정합성 통과 (정상 오탐 0 · 드리프트 적출)"
