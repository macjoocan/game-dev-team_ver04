<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>은발 검사 로컬 모션 비교</title>
<style>:root{color-scheme:dark;font:15px system-ui;background:#111821;color:#edf2f7}body{max-width:1440px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 12px}p{color:#b4c2d0;line-height:1.7}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;background:#202b39;border-radius:10px;margin:20px 0;position:sticky;top:0;z-index:3}button,select{background:#34465b;border:0;color:white;padding:8px;border-radius:5px}input[type=range]{width:260px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#202b39;padding:15px;border-radius:12px}h2{font-size:18px}.stage{background:white;display:flex;align-items:flex-end;justify-content:center;height:448px;overflow:hidden}canvas{height:100%;max-width:100%;object-fit:contain}.small .stage{height:160px}.status{color:#7ed4b9;min-height:26px}a{color:#8ed0ff}.foot{font-size:13px}.line{height:1px;background:#e76565}#ref{height:160px;background:white}</style>
<h1>GPT 은발 원화 · 로컬 걷기 비교</h1>
<p>GPT 원화를 유지하며 로컬 모델이 동작을 만드는 실험입니다. Ludo 26장은 이미 확보한 동작 참조입니다. 이번 실험의 추가 유료 생성은 0회입니다. 원화와 동작 참조를 재사용한 결과이며, 새로운 동작의 제작 능력까지 검증한 것은 아닙니다.</p>
<details><summary>이번에 사용하는 GPT 원화</summary><img id="ref" src="input/gpt-reference.png" alt="GPT 은발 검사 원화"></details>
<div class="toolbar"><button id="play">일시정지</button><label>속도 <select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option></select></label><label><input type="checkbox" id="small">작게 보기</label><input id="seek" type="range" min="0" max="25" value="0"><span id="frame"></span><button id="reload">결과 새로고침</button></div>
<div class="grid" id="cards"></div><p class="foot">같은 프레임 번호로 재생합니다. 발 접지·검과 손의 연결·긴 포니테일·망토·반복 경계를 비교하세요. 자동 검사 점수와 사람의 시각 검수는 별개입니다.</p>
<p><a href="http://127.0.0.1:8193/ludo-silver/index.html">기존 Ludo·GPT B 비교</a> · <a href="http://127.0.0.1:4180/">공동 검수 대시보드</a></p>
<script>
const clips=[{id:'driver',title:'기준 · Ludo 26장',note:'이미 확보한 유료 결과를 동작 참조로 재사용',paths:Array.from({length:26},(_,i)=>`input/driver_${String(i).padStart(3,'0')}.png`)}];
let playing=true,phase=0,previous=performance.now();
const loadImg=url=>new Promise(resolve=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=url});
async function add(c){if(document.getElementById(c.id))return;let a=document.createElement('article');a.className='card';a.id=c.id;a.innerHTML='<h2></h2><div class="status"></div><div class="stage"><canvas width="480" height="512"></canvas></div><p></p>';a.querySelector('h2').textContent=c.title;a.querySelector('p').textContent=c.note;let parent=document.getElementById('cards');if(c.id==='c-motion')parent.insertBefore(a,parent.children[1]);else parent.append(a);c.ctx=a.querySelector('canvas').getContext('2d');c.status=a.querySelector('.status');c.images=await Promise.all(c.paths.map(loadImg));c.status.textContent=c.images.filter(Boolean).length+'장 로드';}
async function refresh(){for(const id of ['a-motion','b-motion','c-motion']){try{let r=await fetch(id+'-run.json?'+Date.now());if(!r.ok)continue;let run=await r.json();if(run.status==='success'){let entries=run.history.outputs['18'].images;let paths=entries.slice(0,26).map(i=>'output/'+(i.subfolder?i.subfolder+'/':'')+i.filename);if(!clips.some(c=>c.id===id)){let c={id,title:{'a-motion':'A · 첫 시험','b-motion':'B · 색 변화 개선','c-motion':'C · 칼 여백 확보'}[id],note:{'a-motion':'12·24번 부근 색 변화·겹침 확인. 미채택.','b-motion':'전체 프레임 디코딩으로 색 튐·겹침 개선. 칼끝 잘림은 남음.','c-motion':'480×512 캔버스에 여백 확보. 검수 전.'}[id],paths};clips.push(c);await add(c);}}else document.title='로컬 모션 · '+run.status;}catch(e){console.warn(e);}}}
function draw(now){let delta=Math.min((now-previous)/1000,.2);previous=now;if(playing)phase=(phase+delta*14.4*Number(speed.value))%26;let frame=Math.floor(phase);seek.value=frame;document.getElementById('frame').textContent=`${frame+1} / 26`;for(const c of clips){if(!c.ctx)continue;let im=c.images?.[frame%c.images.length];c.ctx.fillStyle='white';c.ctx.fillRect(0,0,480,512);if(im)c.ctx.drawImage(im,(480-im.width)/2,(512-im.height)/2);if(frame===0||frame===25){c.ctx.strokeStyle='#e1aa32';c.ctx.lineWidth=3;c.ctx.strokeRect(1,1,478,510);}}requestAnimationFrame(draw);}
const speed=document.getElementById('speed'),seek=document.getElementById('seek');document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생'};seek.oninput=()=>{phase=Number(seek.value);playing=false;document.getElementById('play').textContent='재생'};document.getElementById('small').onchange=e=>document.body.classList.toggle('small',e.target.checked);document.getElementById('reload').onclick=refresh;add(clips[0]);refresh();setInterval(refresh,10000);requestAnimationFrame(draw);
</script></html>
