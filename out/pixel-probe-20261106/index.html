<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel=icon href="data:,"><title>은발 검사 · PixelOE 비교</title>
<style>body{margin:0;background:#111925;color:#e8edf7;font:16px system-ui}main{max-width:1440px;margin:auto;padding:26px}h1{margin:0 0 8px;font-size:28px}p{color:#b8c5d7;line-height:1.6}button,select,input{accent-color:#a8dbc9}button,select{background:#243448;color:#fff;border:1px solid #4c6078;border-radius:7px;padding:9px;margin:4px}a{color:#a8dbc9}.controls{position:sticky;top:0;background:#111925ed;padding:10px 0;z-index:2}.grid{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto}.card{background:#1a2738;border:1px solid #35465d;border-radius:12px;padding:12px;text-align:center}.stage{background:repeating-conic-gradient(#1f2b3c 0% 25%,#243246 0% 50%) 50%/20px 20px;min-height:280px;display:grid;place-items:center;overflow:hidden}canvas{max-width:100%;height:auto;image-rendering:pixelated}h2{font-size:18px}.note{font-size:13px;min-height:42px}.native{min-height:148px;display:grid;place-items:center;background:#141e2b}#frame{width:220px}.light .stage,.light .native{background:#e9e5dd}.light{color:#e8edf7}footer{padding:20px 0;color:#b8c5d7;font-size:14px}</style>
<main><h1>은발 검사 · PixelOE 도트 변환</h1><p>같은 걷기 26장으로 비교합니다. 원본 모션 유지 · 추가 유료 생성 0회 · 사람 검수 대기</p>
<div class="controls"><button id="play">일시 정지</button><label>속도 <select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select></label><label>확대 <select id="zoom"><option value="fit">같은 표시 크기</option><option value="3">3배 정수 확대</option></select></label><button id="bg">밝은 배경</button><input id="frame" aria-label="프레임" type="range" min="0" max="25" value="0"><span id="count">0 / 25</span></div>
<p id="status">이미지를 불러오는 중입니다.</p><section class="grid" id="cards"></section>
<footer>위: 확대 비교 · 아래: 도트 원래 크기. 원본 칸은 120×128 축소 표시입니다.<br>PixelOE는 RGB에 적용했습니다. 투명도는 원본 마스크를 별도로 축소했고, 결과 전체에 같은 32색 팔레트를 적용했습니다. 64·96·128px는 캐릭터 키가 아니라 캔버스 높이입니다.<br><a href="comparison.png">정지 비교 이미지</a> · <a href="REPORT.md">검증 기록</a> · <a href="https://github.com/KohakuBlueleaf/PixelOE">PixelOE 공식 GitHub</a></footer></main>
<script type="module">
const variants=[['original','원본','480×512 · 색 제한 없음'],['nearest96','단순 축소','90×96 · 공통 32색'],['pixeloe64','PixelOE 64','60×64 · 공통 32색'],['pixeloe96','PixelOE 96','90×96 · 공통 32색'],['pixeloe128','PixelOE 128','120×128 · 공통 32색']];
const $=id=>document.getElementById(id);let playing=true,frame=0,time=0,last=0;const clips=[];let errors=[];
for(const [id,title,note] of variants){const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${title}</h2><p class="note">${note}</p><div class="stage"><canvas width="240" height="256"></canvas></div><p>원래 크기</p><div class="native"><canvas></canvas></div>`;$('cards').append(card);const images=await Promise.all(Array.from({length:26},(_,i)=>new Promise(resolve=>{let im=new Image;im.onload=()=>resolve(im);im.onerror=()=>{errors.push(im.src);resolve(null)};im.src=`${id}/frame_${String(i).padStart(4,'0')}.png`;})));clips.push({id,images,large:card.querySelector('.stage canvas'),native:card.querySelector('.native canvas')});}
$('status').textContent=errors.length?`불러오지 못한 이미지 ${errors.length}개`:'130개 이미지 준비 완료 · 26장 동기 재생';window.pixelProbe={loaded:130-errors.length,errors};
function draw(){for(const c of clips){const im=c.images[frame];if(!im)continue;for(const [cv,native] of [[c.large,false],[c.native,true]]){const s=native?(c.id==='original'?0.25:1):($('zoom').value==='3'&&c.id!=='original'?3:256/im.height);cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=c.id==='original';ctx.drawImage(im,0,0,cv.width,cv.height);}}$('frame').value=frame;$('count').textContent=frame+' / 25';window.pixelProbe.frame=frame;}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'일시 정지':'재생'};$('frame').oninput=()=>{playing=false;$('play').textContent='재생';frame=+$('frame').value;draw()};$('zoom').onchange=draw;$('bg').onclick=()=>{document.body.classList.toggle('light');$('bg').textContent=document.body.classList.contains('light')?'어두운 배경':'밝은 배경'};
function tick(t){if(last&&playing){time+=(t-last)*+$('speed').value;while(time>=70){time-=70;frame=(frame+1)%26;}}last=t;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
